# Databricks App definition for Squawk.
#
# Resources to add in the app's UI (Configure -> App resources), with these exact resource keys:
#   sql-warehouse  SQL warehouse                      permission: Can use
#   postgres       Lakebase database (squawk)         permission: Can connect and create
#   llm-fast       Serving endpoint databricks-claude-haiku-4-5    permission: Can query
#   llm-smart      Serving endpoint databricks-claude-sonnet-4-5   permission: Can query
#
# No LLM secret is needed: the agent runs on workspace model serving and authenticates
# as the app's service principal.
command: ["streamlit", "run", "app.py"]

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse

  # These must match squawk_lib/config.py.
  - name: SQUAWK_LAKEBASE_ENDPOINT
    value: "projects/squawk/branches/production/endpoints/primary"
  - name: SQUAWK_CATALOG
    value: "bootcamp_students"
  - name: SQUAWK_SCHEMA
    value: "student_jcdc9919_capstone"
  - name: SQUAWK_LLM_PROVIDER
    value: "databricks"
